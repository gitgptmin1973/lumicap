<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LUMICAP Native Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">操作画面へ移動</a>
  <header>
    <div class="brand"><span>⌗</span><div><strong>LUMICAP</strong><small>NATIVE COMPANION</small></div></div>
    <div class="header-actions">
      <button id="refreshSources">画面を再読込</button>
      <button id="openStudio" class="studio-button">Studioを開く ↗</button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section class="control-panel">
      <div>
        <span class="eyebrow">GLOBAL CAPTURE CONTROL</span>
        <h1>PrintScreenから、<br><em>撮る・切る・残す。</em></h1>
        <p>Windows／Ubuntuの画面やウィンドウを選び、遅延キャプチャ、精密切り抜き、MP4録画を端末内で実行します。閉じた後も通知領域で待機します。</p>
      </div>
      <div class="settings">
        <label>遅延
          <select id="captureDelay">
            <option value="0">なし</option>
            <option value="3">3秒</option>
            <option value="5">5秒</option>
            <option value="10">10秒</option>
          </select>
        </label>
        <label class="check"><input id="includeCursor" type="checkbox" checked> カーソルを含める（OS対応時）</label>
        <label class="check"><input id="includeMic" type="checkbox"> マイク音声</label>
        <label class="check"><input id="includeCamera" type="checkbox"> Webカメラ</label>
        <label>録画形式
          <select id="recordFormat"><option value="mp4">MP4</option><option value="webm">WebM</option></select>
        </label>
      </div>
    </section>

    <section class="workspace">
      <aside>
        <div class="section-title"><div><span>01</span><h2>取得する画面</h2></div><small id="sourceStatus">読込中…</small></div>
        <div id="sourceList" class="source-list" role="listbox" aria-label="画面とウィンドウ"></div>
      </aside>
      <section class="preview-panel">
        <div class="section-title"><div><span>02</span><h2>範囲を整える</h2></div><small>ドラッグで1px単位選択</small></div>
        <div class="canvas-shell" id="canvasShell">
          <canvas id="captureCanvas" width="1280" height="720" aria-label="キャプチャ範囲プレビュー"></canvas>
          <div id="emptyPreview"><b>画面を選択してください</b><span>PrintScreenでも開始できます</span></div>
          <div id="countdown" hidden aria-live="assertive"></div>
        </div>
        <div class="primary-actions">
          <button id="captureButton" class="primary">⌗ 静止画を取得</button>
          <button id="saveSelection" disabled>選択範囲をPNG保存</button>
          <button id="recordButton" class="record">● 録画を開始</button>
        </div>
        <div class="status-row">
          <span id="shortcutState">PrintScreen / Ctrl+Shift+1・2・3 を確認中</span>
          <span id="operationStatus" role="status" aria-live="polite">準備中</span>
        </div>
      </section>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
